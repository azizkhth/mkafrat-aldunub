<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لا يوجد اتصال | مكفرات الذنوب</title>
<meta name="theme-color" content="#0f6b4f">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@dawod/thmanyah-font-web@1.2.0/index.css">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
  font-family:'Thmanyah Sans',sans-serif;background:#faf7f0;color:#2b2620;padding:1rem;line-height:1.9}
.box{background:#fff;border:1px solid #e8ddc3;border-radius:20px;padding:2rem 1.5rem;max-width:420px;
  box-shadow:0 10px 30px rgba(120,90,20,.12)}
h1{font-family:'Thmanyah Serif Display',serif;margin:.3rem 0}
p{color:#7a7060}
button{border:none;border-radius:12px;padding:.8rem 1.6rem;font-family:inherit;font-weight:800;font-size:1rem;
  cursor:pointer;background:linear-gradient(135deg,#15805f,#0f6b4f);color:#fff;min-height:48px}
.icon{font-size:3rem}
</style>
</head>
<body>
<div class="box">
  <div class="icon">📡</div>
  <h1>انقطع الاتصال بالإنترنت</h1>
  <p>تعذّر تحميل الصفحة. تحقق من اتصالك ثم حاول مجدداً — عدّادات تسبيحك محفوظة على جهازك ولن تضيع.</p>
  <button onclick="location.reload()">↻ إعادة المحاولة</button>
</div>
</body>
</html>
